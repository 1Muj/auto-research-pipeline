name: demo_broken_intentional
description: Writes absurd val_loss/val_accuracy; thresholds expect a real MNIST-level run.
hypothesis: "This file is intentionally wrong for repair practice."
governance_phase: build
command:
  - python
  - -c
  - |
    import json
    from pathlib import Path
    Path("metrics.json").write_text(
        json.dumps(
            {
                "val_loss": 9.999,
                "val_accuracy": 0.01,
                "train_loss": 9.999,
                "epochs": 0,
                "duration_sec": 0.01,
                "exit_code": 0,
            },
            indent=2,
        ),
        encoding="utf-8",
    )
metrics_path: metrics.json
success_threshold:
  val_loss: 0.35
  val_accuracy: 0.94
